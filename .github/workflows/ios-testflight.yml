name: iOS to TestFlight

# Manual only. Builds the iPhone app, signs it with Apple's cloud signing (an App Store Connect API key), and uploads it to TestFlight.
# Nothing is published to the App Store by this workflow: that is still a click in App Store Connect.
#
# One-time setup, done by the Apple Account Holder (never by an assistant, never in the repository):
#   1. App Store Connect > Users and Access > Integrations > App Store Connect API > create a key with the "App Manager" role.
#      Download the .p8 file once; note the Key ID and the Issuer ID.
#   2. GitHub > Settings > Environments > create "apple-release", add yourself as a required reviewer, and add these environment secrets:
#        ASC_KEY_ID      the Key ID
#        ASC_ISSUER_ID   the Issuer ID
#        ASC_KEY_P8      the .p8 file contents, base64 encoded (on a Mac: base64 -i AuthKey_XXXX.p8 | pbcopy)
#      and this environment variable:
#        APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com > Membership details)
#   3. The App ID com.visswaverse.voiceremote must exist (developer.apple.com > Identifiers) and an app record must exist in App Store Connect.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  testflight:
    runs-on: macos-latest
    environment: apple-release
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare the Flutter side of the iOS project
        working-directory: app
        run: |
          flutter pub get
          # --no-codesign: this step only generates the Flutter config; the Archive step below signs with the API key.
          flutter build ios --config-only --no-codesign --release --build-number="$GITHUB_RUN_NUMBER"
      - name: Write the API key (removed again at the end)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        working-directory: app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive
      - name: Export and upload to TestFlight
        working-directory: app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
