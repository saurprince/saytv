name: tv_voice_remote
description: "SayTV: a voice remote for OTT apps on Android TV and Google TV, over Wi-Fi"
publish_to: 'none'

# The number after + is the build number and must go up with every upload to either store.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tv_remote_core:
    path: ../core
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apps.json      # a copy of ../spec/apps.json (test/spec_copy_test.dart fails if they differ)
    - assets/catalog.json   # a copy of ../spec/catalog.json, same check
